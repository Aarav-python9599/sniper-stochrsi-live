<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNIPER - Weekly StochRSI</title>
<style>
:root{--bg:#0B0E12;--p:#14181F;--l:#232A35;--t:#E8ECF2;--m:#7E8A9A;--g:#3DDC97;--r:#FF5C5C;--a:#C9A24B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif;padding:18px 14px 50px}
.w{max-width:560px;margin:0 auto}h1{font-size:22px;margin:0 0 4px}.s{font-size:12px;color:var(--m);margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--l);border:1px solid var(--l);border-radius:10px;overflow:hidden;margin-bottom:14px}
.c{background:var(--p);padding:12px;text-align:center}.c b{display:block;font-size:11px;color:var(--m);font-weight:500;margin-bottom:4px;text-transform:uppercase}.c span{font-size:16px;font-weight:600}
.pn{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:12px;margin-bottom:14px}.pt{font-size:11px;color:var(--m);text-transform:uppercase;margin-bottom:8px}
.tag{display:inline-block;padding:4px 9px;border-radius:6px;border:1px solid var(--l);font-size:11px}
.g{color:var(--g)}.r{color:var(--r)}canvas{width:100%;height:150px;display:block}
.lr{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--l);font-size:12px}.lr:last-child{border:0}
</style></head><body><div class="w">
<h1>SNIPER <span style="color:var(--m);font-size:14px">// weekly StochRSI</span></h1><div class="s" id="s">loading...</div>
<div class="row"><div class="c"><b>Cash</b><span id="cash">-</span></div><div class="c"><b>Deployed</b><span id="dep">-</span></div><div class="c"><b>P&amp;L</b><span id="pnl">-</span></div></div>
<div class="pn"><div class="pt">Stochastic RSI (BTC weekly) <span class="tag" id="zone">-</span></div><canvas id="cv" width="520" height="150"></canvas>
<div class="s" style="margin:6px 0 0">%K <b id="k">-</b> &nbsp; %D <b id="d">-</b> &nbsp; BTC <b id="px">-</b></div></div>
<div class="pn"><div class="pt">Trades</div><div id="tr" class="s">none yet - trades are rare by design</div></div>
<div class="s">Paper trading. Reads state.json, updated hourly by GitHub Actions. Buy below 15, sell above 80, confirmed by %K/%D cross.</div></div>
<script>
const f=n=>(n<0?'-$':'$')+Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:2});
fetch('./state.json?t='+Date.now()).then(r=>r.json()).then(s=>{
 document.getElementById('s').innerHTML=s.lastRun?`cycle ${s.cycles} · ${new Date(s.lastRun).toLocaleString()}${s.feedSource?' · via '+s.feedSource:''}${s.lastError?'<br><span class=r>error: '+s.lastError+'</span>':''}`:'no runs yet';
 const pos=s.qty*(s.price||0),tot=s.cash+pos,pnl=tot-s.startBalance;
 cash.textContent=f(s.cash);dep.textContent=tot>0?Math.round(pos/tot*100)+'%':'0%';pnl_=document.getElementById('pnl');pnl_.textContent=(pnl>=0?'+':'')+f(pnl);pnl_.className=pnl>=0?'g':'r';
 const L=(s.series||[]).filter(p=>p.k!=null&&p.d!=null),e=L[L.length-1];
 if(e){k.textContent=e.k.toFixed(1);d.textContent=e.d.toFixed(1);px.textContent=f(s.price);
  const z=e.k<15&&e.d<15?['OVERSOLD - BUY ZONE','g']:e.k>80&&e.d>80?['OVERBOUGHT - SELL ZONE','r']:['NEUTRAL','']; zone.textContent=z[0];zone.className='tag '+z[1];
  const c=cv.getContext('2d'),W=cv.width,H=cv.height,y=v=>H-6-(v/100)*(H-12),x=i=>i/(L.length-1)*W;
  c.fillStyle='rgba(61,220,151,.1)';c.fillRect(0,y(15),W,H-y(15));c.fillStyle='rgba(255,92,92,.1)';c.fillRect(0,0,W,y(80));
  [['d','#9aa6b8'],['k','#C9A24B']].forEach(([key,col])=>{c.beginPath();L.forEach((p,i)=>i?c.lineTo(x(i),y(p[key])):c.moveTo(x(i),y(p[key])));c.strokeStyle=col;c.lineWidth=2;c.stroke()});}
 const t=(s.trades||[]).slice(-15).reverse();
 if(t.length)tr.innerHTML=t.map(x=>`<div class=lr><span>${new Date(x.time).toLocaleDateString()} ${x.side} @ ${f(x.price)} (${f(x.usd)})</span><span>${x.reason}</span></div>`).join('');
}).catch(e=>document.getElementById('s').textContent='could not load state.json: '+e.message);
</script></body></html>
