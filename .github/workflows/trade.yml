name: Run CORE trading cycle

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab

permissions:
  contents: write            # needed to commit the updated state.json back to the repo

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run trading cycle
        run: node trade.mjs

      - name: Commit updated state
        run: |
          git config user.name "core-agent-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "cycle: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
